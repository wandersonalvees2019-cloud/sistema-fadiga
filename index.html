<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setor de Fadiga</title><link rel="stylesheet" href="style.css"></head><body><div id="login"><div class="card"><h1>⛑ SETOR DE FADIGA</h1><p>APP OPERADORES • SEGURANÇA EM MOVIMENTO</p><form id="loginForm"><input id="email" type="email" placeholder="E-mail" required><input id="senha" type="password" placeholder="Senha" required><button>Entrar</button><small id="msg"></small></form></div></div><div id="app" class="hide"><aside><h2>⛑ FADIGA</h2><button class="on">▣ Novo Relatório</button><button>▤ Meus Relatórios</button><button>◷ Pendências</button><button>⇄ Passagem de Turno</button><div class="frase">SEGURANÇA É UMA ESCOLHA DIÁRIA.</div><button id="sair">↪ Sair</button></aside><main><header><b>SETOR DE FADIGA</b><span id="usuario"></span></header><section><div class="head"><div><small>OPERAÇÃO</small><h1>Novo Relatório de Turno</h1></div><em>● Firebase conectado</em></div><form id="relatorio"><div class="panel"><div class="grid4"><label>Data<input id="data" type="date" required></label><label>Turno<input id="turno" readonly></label><label>Horário<select id="horario"><option>06:00 - 18:00</option><option>18:00 - 06:00</option></select></label><label>Responsável<input id="responsavel" readonly></label></div><h3>SITUAÇÃO DO TURNO</h3><div class="status"><label class="normal"><input type="radio" name="sit" value="NORMAL" checked>✓<b>NORMAL</b></label><label class="atencao"><input type="radio" name="sit" value="ATENCAO">!<b>ATENÇÃO</b></label><label class="ocorrencia"><input type="radio" name="sit" value="OCORRENCIA">!<b>OCORRÊNCIA</b></label></div><div class="grid2"><label>Sistema de Fadiga<select id="sistema"><option>NORMAL</option><option>INSTAVEL</option><option>INDISPONIVEL</option></select></label><label>Condições Operacionais<select id="condicoes"><option>NORMAIS</option><option>ATENCAO</option><option>CRITICAS</option></select></label></div></div><div class="panel"><h3>DESCRIÇÃO DO TURNO</h3><div class="grid2"><label>Resumo<textarea id="resumo" required></textarea></label><label>Ocorrências<textarea id="ocorrencias"></textarea></label><label>Pendências recebidas<textarea id="recebidas"></textarea></label><label>Pendências geradas<textarea id="geradas"></textarea></label><label>Ações realizadas<textarea id="acoes"></textarea></label><label>Passagem de turno / Observações<textarea id="passagem"></textarea></label></div><div class="acoes"><button type="reset" class="cinza">Limpar</button><button type="submit">▣ Salvar Relatório</button></div><p id="save"></p></div></form></section></main></div><script type="module" src="app.js"></script></body></html>
